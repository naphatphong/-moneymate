<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">ยินดีต้อนรับกลับมา กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>

    <div id="msg" class="message"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">ชื่อผู้ใช้หรืออีเมล</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="submit" id="submitBtn">เข้าสู่ระบบ</button>
    </form>

    <p class="switch-link">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'กำลังเข้าสู่ระบบ...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await postJSON('/api/login', { username, password });
        showMessage(msg, 'เข้าสู่ระบบสำเร็จ กำลังพาไปหน้าหลัก...', 'success');
        setTimeout(() => { window.location.href = 'app.html'; }, 800);
      } catch (err) {
        showMessage(msg, err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
