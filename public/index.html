<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMate — หน้าแรก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1614;
    --panel: rgba(20, 38, 34, 0.55);
    --line: rgba(255,255,255,0.09);
    --text:#EDEDE7;
    --text-soft:#8FA39B;
    --emerald:#2FBF8F;
    --emerald-dim: rgba(47,191,143,0.16);
    --amber:#E8B04B;
    --coral:#E8836F;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --spring-soft: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; min-height:100vh; background:var(--bg);
    font-family:'Inter',sans-serif; color:var(--text);
    position:relative; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---- starfield + orbs ---- */
  .stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star{ position:absolute; width:2px; height:2px; background:var(--text-soft); border-radius:50%; opacity:0.5; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0.15; } 50%{ opacity:0.7; } }

  .orb{ position:fixed; border-radius:50%; filter: blur(100px); z-index:0; opacity:0.45; pointer-events:none; }
  .orb.o1{ width:380px; height:380px; background: radial-gradient(circle, var(--emerald), transparent 70%); top:-120px; left:-100px; }
  .orb.o2{ width:420px; height:420px; background: radial-gradient(circle, var(--amber), transparent 70%); bottom:-160px; right:-120px; opacity:0.2; }

  /* ---- ambient flying ships in background ---- */
  .bg-ship{ position:fixed; z-index:0; pointer-events:none; opacity:0.5; }
  .bg-ship svg{ width:46px; height:auto; filter: drop-shadow(0 0 6px rgba(47,191,143,0.5)); }
  .bg-ship.s1{ top:14%; animation: flyBy 7s linear infinite; animation-delay: 0.2s; }
  .bg-ship.s2{ top:68%; animation: flyBy 9s linear infinite; animation-delay: 3s; opacity:0.3; }
  .bg-ship.s3{ top:40%; animation: flyBy 11s linear infinite; animation-delay: 6s; opacity:0.22; }
  @keyframes flyBy{
    0%{ left:-10%; transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-14px) rotate(-2deg); }
    100%{ left:110%; transform: translateY(0) rotate(0deg); }
  }

  .wrap{ position:relative; z-index:1; width:100%; max-width:920px; }
  .layout{ display:flex; flex-direction:column; gap:40px; align-items:center; text-align:center; }

  /* ---- animated hero title ---- */
  .hero-title{
    font-family:'Fraunces'; font-style:italic; font-weight:600;
    font-size:clamp(2.6rem, 8vw, 4.6rem); line-height:1.05; margin:0 0 18px;
  }
  .hero-title .char{
    display:inline-block; opacity:0; transform: translateY(24px);
    animation: charIn 0.6s var(--spring) forwards;
  }
  .hero-title .accent{
    background: linear-gradient(100deg, var(--emerald) 30%, #7CE8C4 45%, var(--emerald) 60%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip:text; color:transparent;
    animation: charIn 0.6s var(--spring) forwards, shimmer 3.5s linear infinite 1.4s;
  }
  @keyframes charIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes shimmer{ 0%{ background-position: 200% 0; } 100%{ background-position: -200% 0; } }

  .hero-sub{
    font-size:1rem; color:var(--text-soft); max-width:420px; line-height:1.7;
    opacity:0; animation: fadeUp 0.6s var(--spring-soft) 1.1s forwards;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }

  /* ---- hero chart preview card ---- */
  .preview{
    position:relative; width:100%; max-width:400px;
    background: var(--panel);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border:1px solid var(--line); border-radius:24px;
    padding:24px 22px;
    opacity:0; transform: scale(0.9) translateY(20px);
    animation: cardIn 0.7s var(--spring) 1.3s forwards;
    text-align:left;
  }
  @keyframes cardIn{ to{ opacity:1; transform:scale(1) translateY(0); } }

  .preview .label{ font-size:0.78rem; color:var(--text-soft); margin-bottom:4px; }
  .preview .balance{
    font-family:'Fraunces'; font-style:italic; font-weight:500; font-size:2.1rem;
    font-variant-numeric: tabular-nums;
  }
  .preview .delta{ font-size:0.8rem; color:var(--emerald); margin-top:4px; }

  .chart-wrap{ margin-top:16px; position:relative; }
  .chart-wrap svg{ width:100%; height:auto; display:block; }
  #chartLine{
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: drawLine 1.8s var(--spring-soft) 2.1s forwards;
  }
  @keyframes drawLine{ to{ stroke-dashoffset: 0; } }
  .chart-area{ opacity:0; animation: fadeUp 0.8s ease 2.6s forwards; }

  .chip{
    position:absolute; background: var(--panel); border:1px solid var(--line);
    backdrop-filter: blur(12px);
    border-radius:12px; padding:7px 12px; font-size:0.76rem; font-weight:600;
    opacity:0; transform: translateY(10px) scale(0.9);
    animation: chipIn 0.5s var(--spring) forwards;
  }
  @keyframes chipIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .chip.income{ color:var(--emerald); top:6px; right:10px; animation-delay:2.9s; }
  .chip.expense{ color:var(--coral); bottom:38px; left:14px; animation-delay:3.15s; }

  /* ---- CTAs ---- */
  .ctas{
    display:flex; gap:12px; width:100%; max-width:360px;
    margin:0 auto;
    opacity:0; animation: fadeUp 0.6s var(--spring-soft) 1.6s forwards;
  }
  .ctas a{
    flex:1; text-decoration:none; text-align:center;
    display:flex; align-items:center; justify-content:center;
    padding:15px 0; border-radius:14px; font-weight:600; font-size:0.95rem; line-height:1;
    box-sizing:border-box;
    transition: transform 0.28s var(--spring), box-shadow 0.2s, background 0.2s;
  }
  .ctas a:active{ transform: scale(0.95); }
  .cta-primary{ background: var(--emerald); color:#06231B; }
  .cta-primary:hover{ box-shadow: 0 12px 30px -10px rgba(47,191,143,0.6); }
  .cta-outline{ background:transparent; color:var(--emerald); border:1px solid var(--emerald); }
  .cta-outline:hover{ background: var(--emerald-dim); }

  @media (min-width:860px){
    .layout{ flex-direction:row; text-align:left; align-items:center; justify-content:space-between; gap:60px; }
    .hero-block{ flex:1; display:flex; flex-direction:column; align-items:flex-start; }
    .hero-sub{ max-width:440px; }
    .ctas{ justify-content:flex-start; margin:0; }
    .preview{ flex-shrink:0; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="bg-ship s1"><svg viewBox="0 0 100 40"><path d="M5 20 L70 15 L85 20 L70 25 Z" fill="#2FBF8F"/><circle cx="72" cy="20" r="5" fill="#2FBF8F"/></svg></div>
<div class="bg-ship s2"><svg viewBox="0 0 100 40"><path d="M5 20 L70 15 L85 20 L70 25 Z" fill="#2FBF8F"/><circle cx="72" cy="20" r="5" fill="#2FBF8F"/></svg></div>
<div class="bg-ship s3"><svg viewBox="0 0 100 40"><path d="M5 20 L70 15 L85 20 L70 25 Z" fill="#2FBF8F"/><circle cx="72" cy="20" r="5" fill="#2FBF8F"/></svg></div>

<div class="wrap">
  <div class="layout">
    <div class="hero-block">
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-sub">บันทึกรายรับรายจ่าย ตั้งงบประมาณ และดูภาพรวมการเงินของคุณ ได้ในที่เดียว ไม่หมดก่อนสิ้นเดือนอีกต่อไป</p>
      <div class="ctas" style="margin-top:26px;">
        <a class="cta-primary" href="register.html">เริ่มใช้งาน</a>
        <a class="cta-outline" href="login.html">เข้าสู่ระบบ</a>
      </div>
    </div>

    <div class="preview">
      <div class="label">ยอดเงินคงเหลือ</div>
      <div class="balance">฿36,907.00</div>
      <div class="delta">↑ 12.4% จากเดือนที่แล้ว</div>
      <div class="chart-wrap">
        <svg viewBox="0 0 300 110">
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2FBF8F" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#2FBF8F" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path class="chart-area" d="M0,85 L35,70 L70,78 L105,45 L140,58 L175,25 L210,40 L245,15 L300,20 L300,110 L0,110 Z" fill="url(#areaGrad)"/>
          <path id="chartLine" d="M0,85 L35,70 L70,78 L105,45 L140,58 L175,25 L210,40 L245,15 L300,20" fill="none" stroke="#2FBF8F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="chip income">+5,999.00</div>
        <div class="chip expense">−280.00</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ---- animate hero title letter by letter, keep "Mate" as gradient accent ----
  const title = document.getElementById('heroTitle');
  const word1 = 'Money', word2 = 'Mate';
  let html = '';
  word1.split('').forEach((c, i) => {
    html += `<span class="char" style="animation-delay:${0.3 + i*0.045}s">${c}</span>`;
  });
  word2.split('').forEach((c, i) => {
    html += `<span class="char accent" style="animation-delay:${0.3 + (word1.length+i)*0.045}s">${c}</span>`;
  });
  title.innerHTML = html;

  // ---- scatter a few background stars ----
  const starsEl = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = (Math.random()*3) + 's';
    starsEl.appendChild(s);
  }

  // ---- if already logged in, skip straight to the app ----
  fetch('/api/me').then(res => {
    if (res.ok) window.location.href = 'app.html';
  });
</script>
</body>
</html>
