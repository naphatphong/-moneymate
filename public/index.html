<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1F6E4F;
    --green-mid:#2F8F65;
    --green-mint:#DCF2E4;
    --paper:#F4F5F2;
    --ink:#16281F;
    --ink-soft:#6B7A71;
    --line:#E7ECE5;
    --shadow:0 20px 45px -22px rgba(22,40,31,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#EFF6F1,#F4F5F2 220px);
    font-family:'Sarabun',sans-serif;color:var(--ink);min-height:100vh;
  }
  button{font-family:inherit;}

  .app-frame{
    max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);
    position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  @media (min-width:441px){
    body{padding:28px 12px;}
    .app-frame{min-height:calc(100vh - 56px);border-radius:28px;overflow:hidden;}
  }

  #view-home{display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex:1;padding:48px 30px 34px;text-align:center;}
  .home-top{display:flex;flex-direction:column;align-items:center;}
  .app-name{font-family:'Prompt',sans-serif;font-weight:800;font-size:28px;margin:18px 0 8px;}
  .app-name span{color:var(--green-deep);}
  .app-tagline{font-size:14.5px;color:var(--ink-soft);line-height:1.7;}
  .home-actions{width:100%;max-width:320px;}
  .btn{width:100%;padding:15px 0;border-radius:16px;font-family:'Prompt';font-size:15px;font-weight:600;border:none;cursor:pointer;margin-bottom:11px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--green-deep);color:#fff;}
  .btn-primary:hover{background:#195C42;}
  .btn-outline{background:#fff;color:var(--green-deep);border:1.5px solid var(--green-deep);}
  .btn-outline:hover{background:var(--green-mint);}
  .skyline{width:100%;opacity:.9;margin-top:6px;}
</style>
</head>
<body>

<div class="app-frame">
  <div id="view-home">
    <div class="home-top">
      <svg width="82" height="82" viewBox="0 0 82 82">
        <circle cx="41" cy="41" r="41" fill="#DCF2E4"/>
        <rect x="20" y="30" width="44" height="30" rx="7" fill="#1F6E4F"/>
        <rect x="20" y="30" width="44" height="13" rx="6.5" fill="#2F8F65"/>
        <circle cx="53" cy="46" r="4.5" fill="#F5A623"/>
        <circle cx="24" cy="52" r="7" fill="#F5A623"/>
        <circle cx="33" cy="58" r="5.5" fill="#F7C05C"/>
      </svg>
      <div class="app-name">Money<span>Mate</span></div>
      <div class="app-tagline">จัดการเงินง่าย<br>ไม่หมดก่อนสิ้นเดือน</div>
    </div>
    <div class="home-actions">
      <a class="btn btn-primary" href="register.html" style="text-decoration:none;">เริ่มใช้งาน</a>
      <a class="btn btn-outline" href="login.html" style="text-decoration:none;">เข้าสู่ระบบ</a>
      <svg class="skyline" height="34" viewBox="0 0 280 34">
        <rect x="0" y="14" width="24" height="20" fill="#CFE7D9"/><rect x="28" y="6" width="20" height="28" fill="#BEE3CD"/>
        <rect x="52" y="18" width="18" height="16" fill="#CFE7D9"/><polygon points="80,34 92,10 104,34" fill="#BEE3CD"/>
        <rect x="110" y="12" width="22" height="22" fill="#CFE7D9"/><circle cx="160" cy="24" r="9" fill="#BEE3CD"/>
        <rect x="180" y="8" width="20" height="26" fill="#CFE7D9"/><rect x="205" y="16" width="16" height="18" fill="#BEE3CD"/>
        <polygon points="235,34 246,12 257,34" fill="#CFE7D9"/><rect x="262" y="14" width="18" height="20" fill="#BEE3CD"/>
      </svg>
    </div>
  </div>
</div>

<script>
  // ถ้าล็อคอินอยู่แล้ว ให้พาไปหน้าแอปเลยแทนที่จะแสดงหน้านี้
  fetch('/api/me').then(res => {
    if (res.ok) window.location.href = 'app.html';
  });
</script>
</body>
</html>
