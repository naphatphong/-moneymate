<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก — MoneyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1614;
    --panel: rgba(20, 38, 34, 0.55);
    --panel-solid:#101F1C;
    --line: rgba(255,255,255,0.09);
    --text:#EDEDE7;
    --text-soft:#8FA39B;
    --emerald:#2FBF8F;
    --emerald-dim: rgba(47,191,143,0.16);
    --amber:#E8B04B;
    --coral:#E8836F;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --spring-soft: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; min-height:100vh; background:var(--bg);
    font-family:'Inter',sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    padding:20px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .orb{ position:fixed; border-radius:50%; filter: blur(90px); z-index:0; opacity:0.5; pointer-events:none; }
  .orb.o1{ width:340px; height:340px; background: radial-gradient(circle, var(--emerald), transparent 70%); top:-100px; left:-90px; }
  .orb.o2{ width:380px; height:380px; background: radial-gradient(circle, var(--amber), transparent 70%); bottom:-140px; right:-110px; opacity:0.22; }

  .glass{
    background: var(--panel);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border:1px solid var(--line);
    border-radius:22px;
  }

  .card{
    position:relative; z-index:1;
    width:100%; max-width:380px;
    padding:36px 30px 30px;
    animation: card-in 0.55s var(--spring) 0.05s both;
  }
  @keyframes card-in{
    0%{ transform: scale(0.92) translateY(14px); opacity:0; }
    100%{ transform: scale(1) translateY(0); opacity:1; }
  }

  .brand{ text-align:center; margin-bottom:6px; font-family:'Fraunces'; font-style:italic; font-weight:600; font-size:1.7rem; }
  .brand .accent{ color: var(--emerald); }
  .subtitle{ text-align:center; font-size:0.85rem; color:var(--text-soft); margin: 0 0 26px; }

  .message{
    display:none; font-size:0.82rem; padding:10px 14px; border-radius:12px;
    margin-bottom:18px; text-align:center;
    animation: msg-in 0.35s var(--spring-soft);
  }
  @keyframes msg-in{ 0%{ opacity:0; transform: translateY(-6px); } 100%{ opacity:1; transform: translateY(0); } }
  .message.error{ display:block; background: rgba(232,131,111,0.12); color: var(--coral); border:1px solid rgba(232,131,111,0.3); }
  .message.success{ display:block; background: var(--emerald-dim); color: var(--emerald); border:1px solid rgba(47,191,143,0.3); }

  .field{ margin-bottom:18px; }
  .field .input-wrap{ position:relative; }
  .field input{
    width:100%; background: rgba(255,255,255,0.045); border:1px solid var(--line); border-radius:12px;
    padding:22px 14px 8px; color:var(--text); font-size:0.95rem; font-family:'Inter'; outline:none;
    transition: border-color 0.25s, background 0.25s;
    height:54px;
  }
  .field input:focus{ border-color: var(--emerald); background: rgba(255,255,255,0.06); }
  .field input::placeholder{ color:transparent; }
  .field input.invalid{ border-color: var(--coral); }

  .field label{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    font-size:0.95rem; color:var(--text-soft); pointer-events:none;
    transition: all 0.22s var(--spring-soft);
    background:transparent;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:11px; transform:translateY(0); font-size:0.68rem; color:var(--emerald);
  }
  .field input.invalid:not(:placeholder-shown) + label{ color: var(--coral); }

  .field .hint{ font-size:0.72rem; color:var(--text-soft); margin-top:6px; }
  .field .hint.bad{ color:var(--coral); }
  .field .hint.good{ color:var(--emerald); }

  .toggle-pw{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-soft); cursor:pointer;
    font-size:0.76rem; padding:4px 6px; transition: color 0.2s;
  }
  .toggle-pw:hover{ color:var(--emerald); }

  .strength{ display:flex; gap:4px; margin-top:8px; }
  .strength i{ flex:1; height:3px; border-radius:2px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
  .strength.weak i:nth-child(1){ background: var(--coral); }
  .strength.medium i:nth-child(1),
  .strength.medium i:nth-child(2){ background: var(--amber); }
  .strength.strong i{ background: var(--emerald); }

  .submit{
    width:100%; padding:14px 0; border-radius:12px; border:1px solid var(--emerald);
    background: var(--emerald); color:#06231B; font-weight:600; font-size:0.95rem; cursor:pointer;
    margin-top:8px; transition: transform 0.28s var(--spring), box-shadow 0.2s, opacity 0.2s;
  }
  .submit:hover{ box-shadow: 0 10px 28px -10px rgba(47,191,143,0.6); }
  .submit:active{ transform: scale(0.96); }
  .submit:disabled{ opacity:0.6; cursor:default; transform:none; box-shadow:none; }

  .switch-link{ text-align:center; font-size:0.83rem; color:var(--text-soft); margin-top:22px; }
  .switch-link a{ color: var(--emerald); text-decoration:none; font-weight:600; }
  .switch-link a:hover{ text-decoration:underline; }

  .spinner{
    display:inline-block; width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(6,35,27,0.35); border-top-color:#06231B;
    animation: spin 0.7s linear infinite; margin-right:8px; vertical-align:-2px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---- speeder loader (Uiverse.io by anand_4957, recolored) ---- */
  .loader-screen{
    position:fixed; inset:0; background:var(--bg); z-index:200;
    display:none; align-items:center; justify-content:center; overflow:hidden;
    opacity:0; transition: opacity 0.3s;
  }
  .loader-screen.show{ display:flex; opacity:1; }
  .loader-brand{
    position:absolute; bottom:20%; left:50%; transform:translateX(-50%);
    font-family:'Fraunces'; font-style:italic; font-weight:600; font-size:1.15rem;
    color:var(--text-soft); letter-spacing:0.02em;
  }
  .loader-brand .accent{ color:var(--emerald); }
  .loader { position:absolute; top:50%; margin-left:-50px; left:50%; animation: speeder 0.4s linear infinite; }
  .loader > span { height:5px; width:35px; background:var(--emerald); position:absolute; top:-19px; left:60px; border-radius:2px 10px 1px 0; }
  .base span { position:absolute; width:0; height:0; border-top:6px solid transparent; border-right:100px solid var(--emerald); border-bottom:6px solid transparent; }
  .base span:before { content:""; height:22px; width:22px; border-radius:50%; background:var(--emerald); position:absolute; right:-110px; top:-16px; }
  .base span:after { content:""; position:absolute; width:0; height:0; border-top:0 solid transparent; border-right:55px solid var(--emerald); border-bottom:16px solid transparent; top:-16px; right:-98px; }
  .face { position:absolute; height:12px; width:20px; background:var(--emerald); border-radius:20px 20px 0 0; transform:rotate(-40deg); right:-125px; top:-15px; }
  .face:after { content:""; height:12px; width:12px; background:var(--emerald); right:4px; top:7px; position:absolute; transform:rotate(40deg); transform-origin:50% 50%; border-radius:0 0 0 2px; }
  .loader > span > span:nth-child(1),
  .loader > span > span:nth-child(2),
  .loader > span > span:nth-child(3),
  .loader > span > span:nth-child(4) { width:30px; height:1px; background:var(--emerald); position:absolute; animation: fazer1 0.2s linear infinite; }
  .loader > span > span:nth-child(2) { top:3px; animation: fazer2 0.4s linear infinite; }
  .loader > span > span:nth-child(3) { top:1px; animation: fazer3 0.4s linear infinite; animation-delay:-1s; }
  .loader > span > span:nth-child(4) { top:4px; animation: fazer4 1s linear infinite; animation-delay:-1s; }
  @keyframes fazer1 { 0%{ left:0; } 100%{ left:-80px; opacity:0; } }
  @keyframes fazer2 { 0%{ left:0; } 100%{ left:-100px; opacity:0; } }
  @keyframes fazer3 { 0%{ left:0; } 100%{ left:-50px; opacity:0; } }
  @keyframes fazer4 { 0%{ left:0; } 100%{ left:-150px; opacity:0; } }
  @keyframes speeder {
    0%{ transform: translate(2px,1px) rotate(0deg); }
    10%{ transform: translate(-1px,-3px) rotate(-1deg); }
    20%{ transform: translate(-2px,0px) rotate(1deg); }
    30%{ transform: translate(1px,2px) rotate(0deg); }
    40%{ transform: translate(1px,-1px) rotate(1deg); }
    50%{ transform: translate(-1px,3px) rotate(-1deg); }
    60%{ transform: translate(-1px,1px) rotate(0deg); }
    70%{ transform: translate(3px,1px) rotate(-1deg); }
    80%{ transform: translate(-2px,-1px) rotate(1deg); }
    90%{ transform: translate(2px,1px) rotate(0deg); }
    100%{ transform: translate(1px,-2px) rotate(-1deg); }
  }
  .longfazers{ position:absolute; width:100%; height:100%; }
  .longfazers span{ position:absolute; height:2px; width:20%; background:var(--emerald); opacity:0.35; }
  .longfazers span:nth-child(1){ top:20%; animation: lf 0.6s linear infinite; animation-delay:-5s; }
  .longfazers span:nth-child(2){ top:40%; animation: lf2 0.8s linear infinite; animation-delay:-1s; }
  .longfazers span:nth-child(3){ top:60%; animation: lf3 0.6s linear infinite; }
  .longfazers span:nth-child(4){ top:80%; animation: lf4 0.5s linear infinite; animation-delay:-3s; }
  @keyframes lf { 0%{ left:200%; } 100%{ left:-200%; opacity:0; } }
  @keyframes lf2 { 0%{ left:200%; } 100%{ left:-200%; opacity:0; } }
  @keyframes lf3 { 0%{ left:200%; } 100%{ left:-100%; opacity:0; } }
  @keyframes lf4 { 0%{ left:200%; } 100%{ left:-100%; opacity:0; } }
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="glass card">
  <div class="brand">Money<span class="accent">Mate</span></div>
  <p class="subtitle">สร้างบัญชีใหม่เพื่อเริ่มใช้งาน</p>

  <div id="msg" class="message"></div>

  <form id="registerForm">
    <div class="field">
      <div class="input-wrap">
        <input type="text" id="username" name="username" placeholder=" " required minlength="3" autocomplete="username">
        <label for="username">ชื่อผู้ใช้ (อย่างน้อย 3 ตัวอักษร)</label>
      </div>
    </div>
    <div class="field">
      <div class="input-wrap">
        <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
        <label for="email">อีเมล</label>
      </div>
    </div>
    <div class="field">
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder=" " required minlength="6" autocomplete="new-password">
        <label for="password">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <button type="button" class="toggle-pw" id="togglePw">แสดง</button>
      </div>
      <div class="strength" id="strength"><i></i><i></i><i></i></div>
    </div>
    <div class="field">
      <div class="input-wrap">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder=" " required autocomplete="new-password">
        <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
        <button type="button" class="toggle-pw" id="toggleConfirmPw">แสดง</button>
      </div>
      <div class="hint" id="matchHint"></div>
    </div>
    <button type="submit" class="submit" id="submitBtn">สมัครสมาชิก</button>
  </form>

  <p class="switch-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
</div>

<div class="loader-screen" id="loaderScreen">
  <div class="loader">
    <span><span></span><span></span><span></span><span></span></span>
    <div class="base">
      <span></span>
      <div class="face"></div>
    </div>
  </div>
  <div class="longfazers">
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="loader-brand">Money<span class="accent">Mate</span></div>
</div>

<script>
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const pwInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const matchHint = document.getElementById('matchHint');
  const strengthEl = document.getElementById('strength');

  function bindToggle(btnId, inputEl){
    const t = document.getElementById(btnId);
    t.addEventListener('click', () => {
      const isPw = inputEl.type === 'password';
      inputEl.type = isPw ? 'text' : 'password';
      t.textContent = isPw ? 'ซ่อน' : 'แสดง';
    });
  }
  bindToggle('togglePw', pwInput);
  bindToggle('toggleConfirmPw', confirmInput);

  function scorePassword(pw){
    let score = 0;
    if(pw.length >= 6) score++;
    if(pw.length >= 10) score++;
    if(/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
    if(/[^a-zA-Z0-9]/.test(pw)) score++;
    return Math.min(score, 3);
  }
  pwInput.addEventListener('input', () => {
    const score = scorePassword(pwInput.value);
    strengthEl.className = 'strength';
    if(pwInput.value.length === 0) return;
    if(score <= 1) strengthEl.classList.add('weak');
    else if(score === 2) strengthEl.classList.add('medium');
    else strengthEl.classList.add('strong');
    checkMatch();
  });

  function checkMatch(){
    if(!confirmInput.value){ matchHint.textContent=''; matchHint.className='hint'; return true; }
    if(confirmInput.value === pwInput.value){
      matchHint.textContent = 'รหัสผ่านตรงกัน';
      matchHint.className = 'hint good';
      confirmInput.classList.remove('invalid');
      return true;
    } else {
      matchHint.textContent = 'รหัสผ่านไม่ตรงกัน';
      matchHint.className = 'hint bad';
      confirmInput.classList.add('invalid');
      return false;
    }
  }
  confirmInput.addEventListener('input', checkMatch);

  function showMessage(text, type){
    msg.textContent = text;
    msg.className = 'message ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'message';
    msg.textContent = '';

    if(!checkMatch()){
      showMessage('รหัสผ่านและการยืนยันไม่ตรงกัน', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังสมัครสมาชิก...';

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = pwInput.value;

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      let data = {};
      try { data = await res.json(); } catch (e2) {}

      if (!res.ok) {
        throw new Error(data.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
      }

      showMessage('สมัครสมาชิกสำเร็จ กำลังพาไปหน้าหลัก...', 'success');
      document.getElementById('loaderScreen').classList.add('show');
      setTimeout(() => { window.location.href = 'app.html'; }, 3000);
    } catch (err) {
      showMessage(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'สมัครสมาชิก';
    }
  });
</script>
</body>
</html>
