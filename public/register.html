<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>สมัครสมาชิก</h1>
    <p class="subtitle">สร้างบัญชีใหม่เพื่อเริ่มใช้งาน</p>

    <div id="msg" class="message"></div>

    <form id="registerForm">
      <div class="field">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" name="username" required minlength="3">
      </div>
      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="submit" id="submitBtn">สมัครสมาชิก</button>
    </form>

    <p class="switch-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'กำลังสมัครสมาชิก...';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await postJSON('/api/register', { username, email, password });
        showMessage(msg, 'สมัครสมาชิกสำเร็จ กำลังพาไปหน้าหลัก...', 'success');
        setTimeout(() => { window.location.href = 'app.html'; }, 800);
      } catch (err) {
        showMessage(msg, err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'สมัครสมาชิก';
      }
    });
  </script>
</body>
</html>
