<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก — MoneyMate</title>
<meta name="theme-color" content="#070809">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div class="ambient"></div>

<main class="auth-page">
  <div class="card auth-card">
    <a class="brand-mark" href="/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9"/><path d="M9.5 21.5v-11l6.5 6 6.5-6v11"/></svg>
      <span class="wordmark">Money<span class="accent">Mate</span></span>
    </a>
    <h1 class="two-tone">สร้างบัญชีใหม่<span class="muted">เริ่มคุมเงินได้ในไม่ถึงนาที</span></h1>

    <div id="msg" class="message"></div>

    <form id="registerForm">
      <div class="field">
        <div class="input-wrap">
          <input type="text" id="username" name="username" placeholder=" " required minlength="3" autocomplete="username">
          <label for="username">ชื่อผู้ใช้ (อย่างน้อย 3 ตัวอักษร)</label>
        </div>
      </div>
      <div class="field">
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
          <label for="email">อีเมล</label>
        </div>
      </div>
      <div class="field">
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder=" " required minlength="6" autocomplete="new-password">
          <label for="password">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
          <button type="button" class="toggle-pw" id="togglePw">แสดง</button>
        </div>
        <div class="strength" id="strength"><i></i><i></i><i></i></div>
      </div>
      <div class="field">
        <div class="input-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder=" " required autocomplete="new-password">
          <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
          <button type="button" class="toggle-pw" id="toggleConfirmPw">แสดง</button>
        </div>
        <div class="hint" id="matchHint"></div>
      </div>
      <button type="submit" class="submit" id="submitBtn">สมัครสมาชิก</button>
    </form>

    <div class="google-block hidden" id="googleBlock">
      <div class="or-divider">หรือ</div>
      <a class="google-btn" href="/auth/google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>สมัครด้วย Google</a>
    </div>

    <p class="switch-link">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
  </div>
  <nav class="auth-foot"><a href="/">หน้าแรก</a><a href="terms.html">ข้อกำหนดการใช้งาน</a><a href="privacy.html">นโยบายความเป็นส่วนตัว</a></nav>
</main>

<div class="loader-screen" id="loaderScreen">
  <div class="loader">
    <span><span></span><span></span><span></span><span></span></span>
    <div class="base">
      <span></span>
      <div class="face"></div>
    </div>
  </div>
  <div class="longfazers">
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="loader-brand">Money<span class="accent">Mate</span></div>
</div>

<script>
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const pwInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirmPassword');
  const matchHint = document.getElementById('matchHint');
  const strengthEl = document.getElementById('strength');

  function bindToggle(btnId, inputEl){
    const t = document.getElementById(btnId);
    t.addEventListener('click', () => {
      const isPw = inputEl.type === 'password';
      inputEl.type = isPw ? 'text' : 'password';
      t.textContent = isPw ? 'ซ่อน' : 'แสดง';
    });
  }
  bindToggle('togglePw', pwInput);
  bindToggle('toggleConfirmPw', confirmInput);

  function scorePassword(pw){
    let score = 0;
    if(pw.length >= 6) score++;
    if(pw.length >= 10) score++;
    if(/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
    if(/[^a-zA-Z0-9]/.test(pw)) score++;
    return Math.min(score, 3);
  }
  pwInput.addEventListener('input', () => {
    const score = scorePassword(pwInput.value);
    strengthEl.className = 'strength';
    if(pwInput.value.length === 0) return;
    if(score <= 1) strengthEl.classList.add('weak');
    else if(score === 2) strengthEl.classList.add('medium');
    else strengthEl.classList.add('strong');
    checkMatch();
  });

  function checkMatch(){
    if(!confirmInput.value){ matchHint.textContent=''; matchHint.className='hint'; return true; }
    if(confirmInput.value === pwInput.value){
      matchHint.textContent = 'รหัสผ่านตรงกัน';
      matchHint.className = 'hint good';
      confirmInput.classList.remove('invalid');
      return true;
    } else {
      matchHint.textContent = 'รหัสผ่านไม่ตรงกัน';
      matchHint.className = 'hint bad';
      confirmInput.classList.add('invalid');
      return false;
    }
  }
  confirmInput.addEventListener('input', checkMatch);

  function showMessage(text, type){
    msg.textContent = text;
    msg.className = 'message ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'message';
    msg.textContent = '';

    if(!checkMatch()){
      showMessage('รหัสผ่านและการยืนยันไม่ตรงกัน', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังสมัครสมาชิก...';

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = pwInput.value;

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      let data = {};
      try { data = await res.json(); } catch (e2) {}

      if (!res.ok) {
        throw new Error(data.error || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
      }

      showMessage('สมัครสมาชิกสำเร็จ กำลังพาไปหน้าหลัก...', 'success');
      document.getElementById('loaderScreen').classList.add('show');
      setTimeout(() => {
        document.querySelector('#loaderScreen .loader').classList.add('launch');
        document.querySelector('#loaderScreen .longfazers').classList.add('launch');
      }, 2300);
      setTimeout(() => { window.location.href = 'app.html'; }, 3000);
    } catch (err) {
      showMessage(err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'สมัครสมาชิก';
    }
  });
</script>
<script src="js/google-login.js"></script>
</body>
</html>
