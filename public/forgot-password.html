<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลืมรหัสผ่าน — MoneyMate</title>
<meta name="theme-color" content="#070809">
<script src="js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div class="ambient"></div>

<main class="auth-page">
  <div class="card auth-card">
    <a class="brand-mark" href="/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9"/><path d="M9.5 21.5v-11l6.5 6 6.5-6v11"/></svg>
      <span class="wordmark">Money<span class="accent">Mate</span></span>
    </a>
    <h1 class="two-tone">ลืมรหัสผ่าน<span class="muted">เราจะส่งลิงก์ตั้งรหัสใหม่ให้</span></h1>

    <div id="requestStep">
      <p class="lead">กรอกอีเมลที่ใช้สมัครสมาชิก เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>
      <div id="msg" class="message"></div>
      <form id="forgotForm">
        <div class="field">
          <div class="input-wrap">
            <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
            <label for="email">อีเมล</label>
          </div>
        </div>
        <button type="submit" class="submit" id="submitBtn">ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
      </form>
    </div>

    <div id="sentStep" class="hidden" style="text-align:center; margin-top:22px;">
      <div class="done-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg></div>
      <p class="lead" id="sentText"></p>
      <button type="button" class="submit ghost" id="resendBtn">ส่งอีกครั้ง</button>
    </div>

    <p class="switch-link">นึกรหัสผ่านออกแล้ว? <a href="login.html">กลับไปเข้าสู่ระบบ</a></p>
  </div>
  <nav class="auth-foot"><a href="/">หน้าแรก</a><a href="terms.html">ข้อกำหนดการใช้งาน</a><a href="privacy.html">นโยบายความเป็นส่วนตัว</a></nav>
</main>

<script src="js/auth.js"></script>
<script>
  const form = document.getElementById('forgotForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  async function requestLink(){
    const email = document.getElementById('email').value.trim();
    const data = await postJSON('/api/password/forgot', { email });
    document.getElementById('sentText').textContent = data.message;
    document.getElementById('requestStep').classList.add('hidden');
    document.getElementById('sentStep').classList.remove('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'message';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังส่ง...';
    try {
      await requestLink();
    } catch (err) {
      showMessage(msg, err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'ส่งลิงก์ตั้งรหัสผ่านใหม่';
    }
  });

  document.getElementById('resendBtn').addEventListener('click', () => {
    document.getElementById('sentStep').classList.add('hidden');
    document.getElementById('requestStep').classList.remove('hidden');
  });
</script>

<script src="js/sonar-grid.js"></script>
<script>
  // พื้นหลังจุดมีคลื่น (เบากว่าหน้าแรก) คลิก/แตะที่ไหนก็มีคลื่น
  (function () {
    const ambient = document.querySelector('.ambient');
    ambient.classList.add('sonar', 'wide');
    SonarGrid.mount(ambient, {
      pointerTarget: document,
      pingEvery: 3.2,
      baseOpacity: document.documentElement.dataset.mode === 'light' ? 0.16 : 0.2,
      pingArea: [0.1, 0.1, 0.9, 0.9]
    });
  })();
</script>
</body>
</html>
