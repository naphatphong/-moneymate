<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>ตั้งรหัสผ่านใหม่ — MoneyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1614;
    --panel: rgba(20, 38, 34, 0.55);
    --panel-solid:#101F1C;
    --line: rgba(255,255,255,0.09);
    --text:#EDEDE7;
    --text-soft:#8FA39B;
    --emerald:#2FBF8F;
    --emerald-dim: rgba(47,191,143,0.16);
    --amber:#E8B04B;
    --coral:#E8836F;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --spring-soft: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *{ box-sizing:border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; min-height:100vh; background:var(--bg);
    font-family:'Inter',sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    padding:20px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .orb{ position:fixed; border-radius:50%; filter: blur(90px); z-index:0; opacity:0.5; pointer-events:none; }
  .orb.o1{ width:340px; height:340px; background: radial-gradient(circle, var(--emerald), transparent 70%); top:-100px; left:-90px; }
  .orb.o2{ width:380px; height:380px; background: radial-gradient(circle, var(--amber), transparent 70%); bottom:-140px; right:-110px; opacity:0.22; }

  .glass{
    background: var(--panel);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border:1px solid var(--line);
    border-radius:22px;
  }

  .card{
    position:relative; z-index:1;
    width:100%; max-width:380px;
    padding:36px 30px 30px;
    animation: card-in 0.55s var(--spring) 0.05s both;
  }
  @keyframes card-in{
    0%{ transform: scale(0.92) translateY(14px); opacity:0; }
    100%{ transform: scale(1) translateY(0); opacity:1; }
  }

  .brand{
    text-align:center; margin-bottom:6px;
    font-family:'Fraunces'; font-style:italic; font-weight:600; font-size:1.7rem;
  }
  .brand .accent{ color: var(--emerald); }

  .subtitle{
    text-align:center; font-size:0.85rem; color:var(--text-soft);
    margin: 0 0 28px;
  }

  .message{
    display:none; font-size:0.82rem; padding:10px 14px; border-radius:12px;
    margin-bottom:18px; text-align:center;
    animation: msg-in 0.35s var(--spring-soft);
  }
  @keyframes msg-in{ 0%{ opacity:0; transform: translateY(-6px); } 100%{ opacity:1; transform: translateY(0); } }
  .message.error{ display:block; background: rgba(232,131,111,0.12); color: var(--coral); border:1px solid rgba(232,131,111,0.3); }
  .message.success{ display:block; background: var(--emerald-dim); color: var(--emerald); border:1px solid rgba(47,191,143,0.3); }

  .field{ margin-bottom:20px; }
  .field .input-wrap{ position:relative; }
  .field input{
    width:100%; background: rgba(255,255,255,0.045); border:1px solid var(--line); border-radius:12px;
    padding:22px 14px 8px; color:var(--text); font-size:0.95rem; font-family:'Inter'; outline:none;
    transition: border-color 0.25s, background 0.25s;
    height:54px;
  }
  .field input:focus{ border-color: var(--emerald); background: rgba(255,255,255,0.06); }
  .field input::placeholder{ color:transparent; }

  .field label{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    font-size:0.95rem; color:var(--text-soft); pointer-events:none;
    transition: all 0.22s var(--spring-soft);
    background:transparent;
  }
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label{
    top:11px; transform:translateY(0); font-size:0.68rem; color:var(--emerald);
  }

  .toggle-pw{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--text-soft); cursor:pointer;
    font-size:0.76rem; padding:4px 6px; transition: color 0.2s;
  }
  .toggle-pw:hover{ color:var(--emerald); }

  .submit{
    width:100%; padding:14px 0; border-radius:12px; border:1px solid var(--emerald);
    background: var(--emerald); color:#06231B; font-weight:600; font-size:0.95rem; cursor:pointer;
    margin-top:6px; transition: transform 0.28s var(--spring), box-shadow 0.2s, opacity 0.2s;
  }
  .submit:hover{ box-shadow: 0 10px 28px -10px rgba(47,191,143,0.6); }
  .submit:active{ transform: scale(0.96); }
  .submit:disabled{ opacity:0.6; cursor:default; transform:none; box-shadow:none; }

  .switch-link{
    text-align:center; font-size:0.83rem; color:var(--text-soft); margin-top:22px;
  }
  .switch-link a{ color: var(--emerald); text-decoration:none; font-weight:600; }
  .switch-link a:hover{ text-decoration:underline; }

  .spinner{
    display:inline-block; width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(6,35,27,0.35); border-top-color:#06231B;
    animation: spin 0.7s linear infinite; margin-right:8px; vertical-align:-2px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .hint{ font-size:0.8rem; color:var(--text-soft); line-height:1.6; margin:-6px 0 22px; text-align:center; }
  .done-icon{
    width:60px; height:60px; border-radius:50%; margin:4px auto 18px; background:var(--emerald-dim);
    display:flex; align-items:center; justify-content:center; animation: card-in 0.5s var(--spring) both;
  }
  .done-icon svg{ width:28px; height:28px; stroke:var(--emerald); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="glass card">
  <div class="brand">Money<span class="accent">Mate</span></div>
  <p class="subtitle">ตั้งรหัสผ่านใหม่</p>

  <div id="msg" class="message"></div>

  <div id="checking" class="hint">กำลังตรวจสอบลิงก์...</div>

  <form id="resetForm" class="hidden">
    <div class="field">
      <div class="input-wrap">
        <input type="password" id="password" placeholder=" " required minlength="6" autocomplete="new-password">
        <label for="password">รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
        <button type="button" class="toggle-pw" id="togglePw">แสดง</button>
      </div>
    </div>
    <div class="field">
      <div class="input-wrap">
        <input type="password" id="confirm" placeholder=" " required minlength="6" autocomplete="new-password">
        <label for="confirm">ยืนยันรหัสผ่านใหม่</label>
      </div>
    </div>
    <button type="submit" class="submit" id="submitBtn">บันทึกรหัสผ่านใหม่</button>
  </form>

  <div id="invalidStep" class="hidden" style="text-align:center;">
    <a class="submit" href="forgot-password.html" style="display:block; text-decoration:none;">ขอลิงก์ใหม่</a>
  </div>

  <div id="doneStep" class="hidden" style="text-align:center;">
    <div class="done-icon"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <p class="hint">ตั้งรหัสผ่านใหม่เรียบร้อยแล้ว ใช้รหัสผ่านใหม่เข้าสู่ระบบได้เลย</p>
    <a class="submit" href="login.html" style="display:block; text-decoration:none;">ไปหน้าเข้าสู่ระบบ</a>
  </div>

  <p class="switch-link" id="backLink"><a href="login.html">กลับไปเข้าสู่ระบบ</a></p>
</div>

<script src="js/auth.js"></script>
<script>
  const msg = document.getElementById('msg');
  const form = document.getElementById('resetForm');
  const btn = document.getElementById('submitBtn');
  const pwInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm');

  // เก็บโทเค็นไว้ในตัวแปร แล้วลบออกจากแถบ URL (กันติดไปกับประวัติ/การแชร์ลิงก์)
  const token = new URLSearchParams(location.search).get('token') || '';
  history.replaceState(null, '', location.pathname);

  function showInvalid(){
    document.getElementById('checking').classList.add('hidden');
    form.classList.add('hidden');
    document.getElementById('invalidStep').classList.remove('hidden');
    showMessage(msg, 'ลิงก์นี้หมดอายุหรือถูกใช้ไปแล้ว กรุณาขอลิงก์ใหม่อีกครั้ง', 'error');
  }

  (async () => {
    try {
      const data = token ? await postJSON('/api/password/reset/check', { token }) : { valid:false };
      if (!data.valid) return showInvalid();
      document.getElementById('checking').classList.add('hidden');
      form.classList.remove('hidden');
      pwInput.focus();
    } catch (err) {
      document.getElementById('checking').classList.add('hidden');
      showMessage(msg, err.message, 'error');
    }
  })();

  document.getElementById('togglePw').addEventListener('click', (e) => {
    const show = pwInput.type === 'password';
    pwInput.type = confirmInput.type = show ? 'text' : 'password';
    e.target.textContent = show ? 'ซ่อน' : 'แสดง';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'message';
    if (pwInput.value.length < 6) return showMessage(msg, 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
    if (pwInput.value !== confirmInput.value) return showMessage(msg, 'รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังบันทึก...';
    try {
      await postJSON('/api/password/reset', { token, password: pwInput.value });
      form.classList.add('hidden');
      document.getElementById('doneStep').classList.remove('hidden');
      document.getElementById('backLink').classList.add('hidden');
    } catch (err) {
      showMessage(msg, err.message, 'error');
      btn.disabled = false;
      btn.textContent = 'บันทึกรหัสผ่านใหม่';
    }
  });
</script>

</body>
</html>
