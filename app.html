<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoneyMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1F6E4F;
    --green-mid:#2F8F65;
    --green-mint:#DCF2E4;
    --paper:#F4F5F2;
    --ink:#16281F;
    --ink-soft:#6B7A71;
    --clay:#E2572B;
    --clay-soft:#FDEBE3;
    --line:#E7ECE5;
    --card:#FFFFFF;
    --purple:#8B5CF6;
    --teal:#12A594;
    --teal-soft:#E4F6F3;
    --shadow:0 20px 45px -22px rgba(22,40,31,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#EFF6F1,#F4F5F2 220px);
    font-family:'Sarabun',sans-serif;color:var(--ink);min-height:100vh;
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  .app-frame{
    max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);
    position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  @media (min-width:441px){
    body{padding:28px 12px;}
    .app-frame{min-height:calc(100vh - 56px);border-radius:28px;overflow:hidden;}
  }

  /* ===================== HOME ===================== */
  #view-home{display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex:1;padding:48px 30px 34px;text-align:center;}
  .home-top{display:flex;flex-direction:column;align-items:center;}
  .app-name{font-family:'Prompt',sans-serif;font-weight:800;font-size:28px;margin:18px 0 8px;}
  .app-name span{color:var(--green-deep);}
  .app-tagline{font-size:14.5px;color:var(--ink-soft);line-height:1.7;}
  .home-actions{width:100%;max-width:320px;}
  .btn{width:100%;padding:15px 0;border-radius:16px;font-family:'Prompt';font-size:15px;font-weight:600;border:none;cursor:pointer;margin-bottom:11px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, opacity .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--green-deep);color:#fff;}
  .btn-primary:hover{background:#195C42;}
  .btn-outline{background:#fff;color:var(--green-deep);border:1.5px solid var(--green-deep);}
  .btn-outline:hover{background:var(--green-mint);}
  .divider{font-size:12px;color:var(--ink-soft);margin:2px 0 11px;}
  .btn-google{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn-google:hover{background:#FAFAF8;}
  .skyline{width:100%;opacity:.9;margin-top:6px;}

  /* ===================== APP SHELL ===================== */
  #view-shell{display:none;flex-direction:column;flex:1;min-height:100%;}
  #view-shell.ready{display:flex;}
  .app-header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:20px 20px 14px;background:var(--paper);position:sticky;top:0;z-index:20;
  }
  .header-title{font-family:'Prompt';font-weight:700;font-size:18px;}
  .icon-btn{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative;flex:0 0 36px;}
  .icon-btn:hover{background:#F3F6F3;}
  .icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;background:var(--clay);border-radius:50%;border:1.5px solid #fff;}

  .app-main{flex:1;overflow-y:auto;padding:2px 20px 100px;}
  .tab-view{display:none;}
  .tab-view.active{display:block;animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* Dashboard */
  .balance-card{background:linear-gradient(135deg,var(--green-deep),var(--green-mid) 140%);border-radius:22px;padding:20px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;}
  .balance-card::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);}
  .balance-label{font-size:12.5px;opacity:.85;margin-bottom:6px;}
  .balance-amount{font-family:'Prompt';font-size:29px;font-weight:700;}
  .balance-sub{font-size:11.5px;opacity:.85;margin-top:8px;}

  .budget-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 17px;margin-bottom:14px;}
  .budget-cols{display:flex;justify-content:space-between;margin-bottom:10px;}
  .budget-item .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;}
  .budget-item .value{font-family:'Prompt';font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;border-bottom:1px dashed transparent;}
  .budget-item .value.editable:hover{border-bottom-color:var(--green-deep);}
  .budget-item input{font-family:'Prompt';font-weight:700;font-size:16px;color:var(--ink);width:90px;border:1px solid var(--green-mid);border-radius:8px;padding:2px 6px;}
  .progress-track{height:9px;border-radius:999px;background:#EAF1EC;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;border-radius:999px;background:var(--green-deep);transition:width .3s ease;}
  .progress-fill.over{background:var(--clay);}
  .budget-caption{font-size:12px;color:var(--ink-soft);text-align:center;}

  .quick-actions{display:flex;gap:12px;margin-bottom:18px;}
  .qa-btn{flex:1;border-radius:16px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-family:'Prompt';font-size:12.5px;font-weight:600;border:none;cursor:pointer;}
  .qa-income{background:var(--green-mint);color:var(--green-deep);}
  .qa-expense{background:var(--clay-soft);color:var(--clay);}
  .qa-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
  .qa-income .qa-icon{background:var(--green-deep);}
  .qa-expense .qa-icon{background:var(--clay);}

  .section-title{font-family:'Prompt';font-weight:600;font-size:14px;margin:2px 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .section-title .link{font-size:12px;font-weight:600;color:var(--green-deep);cursor:pointer;background:none;border:none;font-family:'Prompt';}

  .tx-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .tx-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 38px;font-size:16px;}
  .tx-info{flex:1;min-width:0;}
  .tx-title{font-size:13.5px;font-weight:600;color:var(--ink);}
  .tx-meta{font-size:11.5px;color:var(--ink-soft);}
  .tx-amount{font-family:'Prompt';font-size:13.5px;font-weight:700;white-space:nowrap;}
  .tx-amount.neg{color:var(--clay);}
  .tx-amount.pos{color:var(--green-deep);}
  .empty-note{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 0;}

  /* List tab */
  .list-filters{display:flex;gap:8px;margin-bottom:14px;}
  .filter-chip{padding:7px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Prompt';}
  .filter-chip.active{background:var(--green-deep);color:#fff;border-color:var(--green-deep);}
  .date-group-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin:14px 0 4px;font-family:'Prompt';}

  /* Reports */
  .seg-control{display:flex;background:#EBEDE7;border-radius:13px;padding:4px;margin-bottom:16px;}
  .seg-option{flex:1;text-align:center;padding:9px 0;font-family:'Prompt';font-size:12.5px;font-weight:600;color:var(--ink-soft);border-radius:10px;cursor:pointer;border:none;background:none;}
  .seg-option.active{background:var(--green-deep);color:#fff;}

  .donut-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px;}
  .donut-card-title{font-family:'Prompt';font-size:13px;font-weight:600;margin-bottom:12px;}
  .donut-row{display:flex;align-items:center;gap:16px;}
  .donut{width:104px;height:104px;border-radius:50%;flex:0 0 104px;display:flex;align-items:center;justify-content:center;position:relative;}
  .donut::before{content:"";position:absolute;width:66px;height:66px;background:var(--card);border-radius:50%;}
  .donut-center{position:relative;font-family:'Prompt';font-size:11px;font-weight:700;text-align:center;line-height:1.35;}
  .legend-list{flex:1;display:flex;flex-direction:column;gap:7px;}
  .legend-row{display:flex;align-items:center;gap:7px;font-size:11.5px;}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .legend-row .lname{flex:1;color:var(--ink-soft);}
  .legend-row .lval{font-weight:700;text-align:right;font-family:'Prompt';font-size:11px;}

  .line-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 17px 8px;margin-bottom:14px;}
  .line-card-title{font-family:'Prompt';font-size:13px;font-weight:600;margin-bottom:10px;}

  .alert-box{border-radius:15px;padding:14px 15px;margin-bottom:12px;display:flex;gap:9px;align-items:flex-start;}
  .alert-box.warn{background:var(--clay-soft);border:1px solid #F5CBB6;}
  .alert-box.ok{background:var(--green-mint);border:1px solid #BEE3CD;}
  .alert-box .icon{font-size:17px;line-height:1.1;}
  .alert-title{font-family:'Prompt';font-weight:700;font-size:12.5px;margin-bottom:2px;}
  .alert-box.warn .alert-title{color:#B8391A;}
  .alert-box.ok .alert-title{color:var(--green-deep);}
  .alert-text{font-size:11.5px;line-height:1.5;}
  .alert-box.warn .alert-text{color:#8A3821;}
  .alert-box.ok .alert-text{color:#1E4A38;}

  .tip-box{background:var(--teal-soft);border:1px solid #BFE6E0;border-radius:15px;padding:14px 15px;display:flex;gap:9px;align-items:flex-start;}
  .tip-box .icon{color:var(--teal);font-size:17px;line-height:1.1;}
  .tip-title{font-family:'Prompt';font-weight:700;font-size:12.5px;color:#0C7A6E;margin-bottom:2px;}
  .tip-text{font-size:11.5px;color:#0C5E56;line-height:1.5;}

  /* Profile */
  .profile-head{display:flex;flex-direction:column;align-items:center;padding:18px 0 22px;}
  .avatar-lg{width:74px;height:74px;border-radius:50%;background:var(--green-mint);display:flex;align-items:center;justify-content:center;font-family:'Prompt';font-weight:700;color:var(--green-deep);font-size:26px;margin-bottom:10px;}
  .profile-name{font-family:'Prompt';font-weight:700;font-size:16px;}
  .profile-sub{font-size:12.5px;color:var(--ink-soft);}
  .profile-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;font-weight:500;cursor:pointer;}
  .profile-row .r-left{display:flex;align-items:center;gap:12px;}
  .toggle{width:40px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 40px;}
  .toggle.on{background:var(--green-deep);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s ease;}
  .toggle.on .knob{left:20px;}
  .btn-logout{width:100%;padding:13px 0;border-radius:15px;background:var(--clay-soft);color:var(--clay);border:none;font-family:'Prompt';font-weight:600;font-size:13.5px;cursor:pointer;margin-top:8px;}

  /* Bottom nav */
  .bottom-nav{
    position:sticky;bottom:0;flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;
    border-top:1px solid var(--line);background:#fff;padding:8px 6px 10px;z-index:20;
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--ink-soft);font-family:'Prompt';font-weight:500;background:none;border:none;cursor:pointer;padding:4px 8px;}
  .nav-item.active{color:var(--green-deep);}
  .nav-dot{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
  .nav-item.center{margin-top:-22px;}
  .nav-item.center .nav-dot{width:44px;height:44px;border-radius:15px;background:var(--green-deep);color:#fff;box-shadow:0 10px 18px -6px rgba(31,110,79,.55);}
  .nav-item.center:hover .nav-dot{background:#195C42;}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(22,40,31,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;}
  .modal-overlay.open{display:flex;}
  .modal-sheet{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:22px 22px 26px;max-height:88vh;overflow-y:auto;animation:slideup .2s ease;}
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:40px;height:4px;background:var(--line);border-radius:999px;margin:0 auto 16px;}
  .modal-title{font-family:'Prompt';font-weight:700;font-size:16px;margin-bottom:16px;}
  .type-toggle{display:flex;background:#EFEFE7;border-radius:13px;padding:4px;margin-bottom:16px;}
  .type-opt{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-family:'Prompt';font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .type-opt.active-expense{background:var(--clay);color:#fff;}
  .type-opt.active-income{background:var(--green-deep);color:#fff;}
  .field-label{font-size:12px;color:var(--ink-soft);font-weight:600;margin:12px 0 6px;font-family:'Prompt';}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cat-chip{border:1.5px solid var(--line);border-radius:13px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;background:#fff;}
  .cat-chip .em{font-size:18px;display:block;margin-bottom:4px;}
  .cat-chip.selected{border-color:var(--green-deep);background:var(--green-mint);color:var(--green-deep);}
  .field-input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;font-size:14px;color:var(--ink);}
  .field-input:focus{outline:none;border-color:var(--green-deep);}
  .field-error{color:var(--clay);font-size:11.5px;margin-top:4px;display:none;}
  .modal-actions{margin-top:20px;}
  .btn-cancel{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-family:'Prompt';font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:200;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app-frame" id="appFrame">

  <!-- ============ APP SHELL ============ -->
  <div id="view-shell">
    <div class="app-header">
      <div class="icon-btn" onclick="showToast('เมนู')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="header-title" id="headerTitle">หน้าหลัก</div>
      <div class="icon-btn" onclick="showToast('ยังไม่มีการแจ้งเตือนใหม่')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 00-5 5v3.4c0 .6-.2 1.2-.6 1.7L5 15h14l-1.4-1.9c-.4-.5-.6-1.1-.6-1.7V8a5 5 0 00-5-5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 18a2 2 0 004 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div class="dot"></div>
      </div>
    </div>

    <div class="app-main">

      <!-- DASHBOARD TAB -->
      <section class="tab-view active" id="tab-dashboard">
        <div class="balance-card">
          <div class="balance-label">ยอดเงินคงเหลือ</div>
          <div class="balance-amount" id="balanceAmount">0.00 บาท</div>
          <div class="balance-sub" id="balanceSub"></div>
        </div>
        <div class="budget-box">
          <div class="budget-cols">
            <div class="budget-item">
              <div class="label">งบประมาณเดือนนี้</div>
              <div class="value editable" id="budgetValueDisplay" onclick="editBudget()"></div>
            </div>
            <div class="budget-item" style="text-align:right;">
              <div class="label">ใช้ไปแล้ว</div>
              <div class="value" id="usedValueDisplay"></div>
            </div>
          </div>
          <div class="progress-track"><div class="progress-fill" id="budgetProgress"></div></div>
          <div class="budget-caption" id="budgetCaption"></div>
        </div>
        <div class="quick-actions">
          <button class="qa-btn qa-income" onclick="openAddModal('income')">
            <div class="qa-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            เพิ่มรายรับ
          </button>
          <button class="qa-btn qa-expense" onclick="openAddModal('expense')">
            <div class="qa-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            เพิ่มรายจ่าย
          </button>
        </div>
        <div class="section-title">รายการล่าสุด <button class="link" onclick="goTab('list')">ดูทั้งหมด ›</button></div>
        <div id="recentTxList"></div>
      </section>

      <!-- LIST TAB -->
      <section class="tab-view" id="tab-list">
        <div class="list-filters" id="listFilters"></div>
        <div id="fullTxList"></div>
      </section>

      <!-- REPORTS TAB -->
      <section class="tab-view" id="tab-reports">
        <div class="seg-control" id="periodSeg"></div>
        <div class="donut-card">
          <div class="donut-card-title">สรุปการใช้จ่าย</div>
          <div class="donut-row">
            <div class="donut" id="donutChart"><div class="donut-center" id="donutCenter"></div></div>
            <div class="legend-list" id="donutLegend"></div>
          </div>
        </div>
        <div class="line-card">
          <div class="line-card-title">แนวโน้มการใช้จ่ายรายสัปดาห์</div>
          <svg width="100%" height="86" viewBox="0 0 250 86" id="trendSvg"></svg>
        </div>
        <div id="alertBox"></div>
        <div class="tip-box">
          <div class="icon">💡</div>
          <div><div class="tip-title">คำแนะนำ</div><div class="tip-text" id="tipText"></div></div>
        </div>
      </section>

      <!-- PROFILE TAB -->
      <section class="tab-view" id="tab-profile">
        <div class="profile-head">
          <div class="avatar-lg" id="profileAvatar">?</div>
          <div class="profile-name" id="profileName">-</div>
          <div class="profile-sub" id="profileEmail"></div>
        </div>
        <div class="profile-row" onclick="showToast('แก้ไขโปรไฟล์')"><span>แก้ไขโปรไฟล์</span><span>›</span></div>
        <div class="profile-row" onclick="editBudget(); goTab('dashboard');"><span>ตั้งค่างบประมาณรายเดือน</span><span>›</span></div>
        <div class="profile-row">
          <div class="r-left"><span>การแจ้งเตือน</span></div>
          <div class="toggle on" id="notifToggle" onclick="toggleNotif()"><div class="knob"></div></div>
        </div>
        <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
      </section>

    </div>

    <div class="bottom-nav">
      <button class="nav-item active" id="nav-dashboard" onclick="goTab('dashboard')"><div class="nav-dot">🏠</div>หน้าหลัก</button>
      <button class="nav-item" id="nav-list" onclick="goTab('list')"><div class="nav-dot">📋</div>รายการ</button>
      <button class="nav-item center" onclick="openAddModal('expense')"><div class="nav-dot">＋</div></button>
      <button class="nav-item" id="nav-reports" onclick="goTab('reports')"><div class="nav-dot">📊</div>รายงาน</button>
      <button class="nav-item" id="nav-profile" onclick="goTab('profile')"><div class="nav-dot">👤</div>โปรไฟล์</button>
    </div>
  </div>

</div>

<!-- ADD TRANSACTION MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">เพิ่มรายการ</div>
    <div class="type-toggle">
      <div class="type-opt" id="typeExpenseOpt" onclick="setModalType('expense')">รายจ่าย</div>
      <div class="type-opt" id="typeIncomeOpt" onclick="setModalType('income')">รายรับ</div>
    </div>
    <div id="categoryField">
      <div class="field-label">หมวดหมู่</div>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="field-label">รายการ</div>
    <input class="field-input" id="txTitle" placeholder="เช่น ข้าวมันไก่, ค่ารถเมล์">
    <div class="field-label">จำนวนเงิน (บาท)</div>
    <input class="field-input" id="txAmount" type="number" min="0" step="0.01" placeholder="0.00">
    <div class="field-error" id="txError">กรุณาระบุจำนวนเงินให้ถูกต้อง</div>
    <div class="field-label">วันที่</div>
    <input class="field-input" id="txDate" type="date">
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="submitTransaction()">บันทึกรายการ</button>
      <button class="btn btn-cancel" onclick="closeAddModal()">ยกเลิก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== DATA ===================== */
const CATS = {
  food:{label:'อาหาร', em:'🍽️', color:'#E2572B'},
  travel:{label:'เดินทาง', em:'🚌', color:'#8B5CF6'},
  entertainment:{label:'บันเทิง', em:'🎬', color:'#12A594'},
  shopping:{label:'ช้อปปิ้ง', em:'🛍️', color:'#4FC3E8'},
  other:{label:'อื่นๆ', em:'📦', color:'#B98CE0'},
};
const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TODAY = new Date(2024,4,10); // 10 พ.ค. 2567 — reference "today" for this demo

let state = {
  openingBalance: 5000,
  budget: 6000,
  notif: true,
  reportPeriod: 'month',
  listFilter: 'all',
  txs: [
    {id:1, type:'income', cat:'income', title:'เงินเดือน', amount:3500, date:new Date(2024,4,1)},
    {id:2, type:'expense', cat:'food', title:'อาหารเช้า', amount:60, date:new Date(2024,4,2)},
    {id:3, type:'expense', cat:'travel', title:'ค่ารถเมล์', amount:15, date:new Date(2024,4,2)},
    {id:4, type:'expense', cat:'entertainment', title:'สตรีมมิ่งเพลง', amount:129, date:new Date(2024,4,3)},
    {id:5, type:'expense', cat:'entertainment', title:'ดูหนัง', amount:280, date:new Date(2024,4,4)},
    {id:6, type:'expense', cat:'travel', title:'ค่ารถไฟฟ้า', amount:320, date:new Date(2024,4,5)},
    {id:7, type:'expense', cat:'other', title:'ค่าปรับห้องสมุด', amount:40, date:new Date(2024,4,5)},
    {id:8, type:'expense', cat:'shopping', title:'เสื้อยืด', amount:259, date:new Date(2024,4,6)},
    {id:9, type:'expense', cat:'food', title:'ข้าวมันไก่', amount:80, date:new Date(2024,4,7,12,30)},
    {id:10, type:'expense', cat:'food', title:'กาแฟ', amount:55, date:new Date(2024,4,7,8,45)},
    {id:11, type:'expense', cat:'shopping', title:'ของใช้ส่วนตัว', amount:96, date:new Date(2024,4,8)},
    {id:12, type:'expense', cat:'other', title:'บริจาค', amount:100, date:new Date(2024,4,9)},
    {id:13, type:'expense', cat:'food', title:'มื้อเย็นกับเพื่อน', amount:220, date:new Date(2024,4,9)},
  ]
};
let nextId = 14;
let modalType = 'expense';
let modalCat = 'food';

/* ===================== HELPERS ===================== */
function money(n){ return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function thaiDate(d){ return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear()+543}`; }
function thaiTime(d){ if(d.getHours()===0 && d.getMinutes()===0) return ''; const h=String(d.getHours()).padStart(2,'0'), m=String(d.getMinutes()).padStart(2,'0'); return ` · ${h}:${m}`; }
function iconFor(tx){ return tx.type==='income' ? '💰' : CATS[tx.cat].em; }
function bgFor(tx){ return tx.type==='income' ? '#DCF2E4' : CATS[tx.cat].color+'22'; }

function totalBalance(){
  return state.txs.reduce((s,t)=> s + (t.type==='income'? t.amount : -t.amount), state.openingBalance);
}
function monthExpense(){
  return state.txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
}
function sortedTxs(){
  return [...state.txs].sort((a,b)=> b.date - a.date);
}

/* ===================== AUTH / NAVIGATION ===================== */
async function checkAuthAndEnter(){
  try{
    const res = await fetch('/api/me');
    if(!res.ok) throw new Error('unauthorized');
    const data = await res.json();
    document.getElementById('profileName').textContent = data.user.username;
    document.getElementById('profileEmail').textContent = data.user.email;
    document.getElementById('profileAvatar').textContent = data.user.username.charAt(0).toUpperCase();
    document.getElementById('view-shell').classList.add('ready');
    goTab('dashboard');
  }catch(err){
    window.location.href = 'login.html';
  }
}
async function logout(){
  await fetch('/api/logout', { method:'POST' });
  window.location.href = 'login.html';
}
const TAB_TITLES = {dashboard:'หน้าหลัก', list:'รายการทั้งหมด', reports:'รายงานการใช้จ่าย', profile:'โปรไฟล์'};
function goTab(tab){
  document.querySelectorAll('.tab-view').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.bottom-nav .nav-item').forEach(el=>el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+tab);
  if(navEl) navEl.classList.add('active');
  document.getElementById('headerTitle').textContent = TAB_TITLES[tab];
  document.getElementById('appFrame').scrollTop = 0;
  document.querySelector('.app-main').scrollTop = 0;
  if(tab==='list') renderList();
  if(tab==='reports') renderReports();
  if(tab==='dashboard') renderDashboard();
}

/* ===================== RENDER: DASHBOARD ===================== */
function renderDashboard(){
  const bal = totalBalance();
  document.getElementById('balanceAmount').textContent = money(bal) + ' บาท';
  const used = monthExpense();
  const remain = state.budget - used;
  const pct = Math.min(100, Math.round(used/state.budget*100));
  document.getElementById('budgetValueDisplay').textContent = money(state.budget)+' บาท';
  document.getElementById('usedValueDisplay').textContent = money(used)+' บาท';
  const fill = document.getElementById('budgetProgress');
  fill.style.width = pct+'%';
  fill.classList.toggle('over', used > state.budget);
  document.getElementById('budgetCaption').textContent = remain>=0
    ? `เหลือ ${money(remain)} บาท (${pct}%)`
    : `เกินงบประมาณ ${money(Math.abs(remain))} บาท`;
  document.getElementById('balanceSub').textContent = `รายรับสะสม ${money(state.txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0))} บาท`;

  const recent = sortedTxs().slice(0,4);
  document.getElementById('recentTxList').innerHTML = recent.map(txRow).join('') || '<div class="empty-note">ยังไม่มีรายการ</div>';
}

function txRow(t){
  return `<div class="tx-item">
    <div class="tx-icon" style="background:${bgFor(t)}">${iconFor(t)}</div>
    <div class="tx-info"><div class="tx-title">${t.title||CATS[t.cat]?.label||'รายรับ'}</div><div class="tx-meta">${thaiDate(t.date)}${thaiTime(t.date)}</div></div>
    <div class="tx-amount ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'-'}${money(t.amount)}</div>
  </div>`;
}

/* ===================== RENDER: LIST ===================== */
function renderList(){
  const filters = [['all','ทั้งหมด'],['income','รายรับ'],['expense','รายจ่าย']];
  document.getElementById('listFilters').innerHTML = filters.map(([k,l])=>
    `<button class="filter-chip ${state.listFilter===k?'active':''}" onclick="setListFilter('${k}')">${l}</button>`).join('');

  let list = sortedTxs();
  if(state.listFilter!=='all') list = list.filter(t=>t.type===state.listFilter);

  let html='', lastDateKey='';
  list.forEach(t=>{
    const key = thaiDate(t.date);
    if(key!==lastDateKey){ html += `<div class="date-group-label">${key}</div>`; lastDateKey=key; }
    html += txRow(t);
  });
  document.getElementById('fullTxList').innerHTML = html || '<div class="empty-note">ไม่พบรายการ</div>';
}
function setListFilter(f){ state.listFilter=f; renderList(); }

/* ===================== RENDER: REPORTS ===================== */
function filteredExpenseTxs(){
  if(state.reportPeriod==='week'){
    const weekAgo = new Date(TODAY); weekAgo.setDate(weekAgo.getDate()-7);
    return state.txs.filter(t=>t.type==='expense' && t.date>=weekAgo && t.date<=TODAY);
  }
  return state.txs.filter(t=>t.type==='expense'); // month & year: full seeded dataset
}

function renderReports(){
  document.getElementById('periodSeg').innerHTML = ['week','month','year'].map(p=>
    `<button class="seg-option ${state.reportPeriod===p?'active':''}" onclick="setPeriod('${p}')">${p==='week'?'สัปดาห์':p==='month'?'เดือน':'ปี'}</button>`).join('');

  const list = filteredExpenseTxs();
  const totals = {};
  let grand = 0;
  Object.keys(CATS).forEach(k=>totals[k]=0);
  list.forEach(t=>{ totals[t.cat]=(totals[t.cat]||0)+t.amount; grand+=t.amount; });

  // donut conic-gradient
  let acc=0, stops=[];
  Object.keys(CATS).forEach(k=>{
    if(totals[k]>0){
      const pct = grand>0 ? totals[k]/grand*100 : 0;
      stops.push(`${CATS[k].color} ${acc}% ${acc+pct}%`);
      acc += pct;
    }
  });
  document.getElementById('donutChart').style.background = stops.length ? `conic-gradient(${stops.join(',')})` : '#EAF1EC';
  document.getElementById('donutCenter').innerHTML = `${money(grand)}<br>บาท`;
  document.getElementById('donutLegend').innerHTML = Object.keys(CATS).filter(k=>totals[k]>0).map(k=>{
    const pct = grand>0 ? Math.round(totals[k]/grand*100) : 0;
    return `<div class="legend-row"><span class="legend-dot" style="background:${CATS[k].color}"></span><span class="lname">${CATS[k].label} ${pct}%</span><span class="lval">${money(totals[k])} บาท</span></div>`;
  }).join('') || '<div class="empty-note">ไม่มีรายจ่ายในช่วงนี้</div>';

  // weekly trend (always based on full month buckets, day-of-month ranges)
  const buckets=[0,0,0,0,0];
  state.txs.filter(t=>t.type==='expense').forEach(t=>{
    const day=t.date.getDate();
    const idx = Math.min(4, Math.floor((day-1)/7));
    buckets[idx]+=t.amount;
  });
  const maxV = Math.max(...buckets, 100);
  const pts = buckets.map((v,i)=>({x:30+i*47, y: 66 - (v/maxV)*54}));
  const poly = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="2.6" fill="#1F6E4F"/>`).join('');
  const labels = pts.map((p,i)=>`<text x="${p.x}" y="80" font-size="7" fill="#9AA79E" font-family="Sarabun" text-anchor="middle">สัปดาห์ ${i+1}</text>`).join('');
  document.getElementById('trendSvg').innerHTML = `
    <polyline points="${poly}" fill="none" stroke="#1F6E4F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}`;

  // alert / tip
  let topCat=null, topPct=0;
  Object.keys(CATS).forEach(k=>{ const p = grand>0?totals[k]/grand*100:0; if(p>topPct){topPct=p; topCat=k;} });
  const alertBox = document.getElementById('alertBox');
  if(topCat && topPct>=35){
    alertBox.innerHTML = `<div class="alert-box warn"><div class="icon">⚠️</div><div>
      <div class="alert-title">แจ้งเตือน</div>
      <div class="alert-text">คุณใช้จ่ายกับ "${CATS[topCat].label}" มากถึง ${Math.round(topPct)}% ของรายจ่ายทั้งหมด แนะนำให้ลดลงเพื่อคุมงบให้อยู่ในแผน</div>
    </div></div>`;
  } else {
    alertBox.innerHTML = `<div class="alert-box ok"><div class="icon">✅</div><div>
      <div class="alert-title">อยู่ในเกณฑ์ที่ดี</div>
      <div class="alert-text">การใช้จ่ายของคุณกระจายตัวดี ไม่มีหมวดใดใช้เกินสัดส่วนที่เหมาะสม</div>
    </div></div>`;
  }
  const tips = {
    food:'ลองทำอาหารเองสัปดาห์ละ 2-3 วัน ช่วยประหยัดได้หลายร้อยบาทต่อเดือน',
    travel:'ลองใช้บัตรโดยสารรายเดือนหรือวางแผนเส้นทางร่วมกับเพื่อน เพื่อลดค่าเดินทาง',
    entertainment:'ลองแชร์บัญชีสตรีมมิ่งกับเพื่อนหรือครอบครัว เพื่อลดค่าใช้จ่ายรายเดือน',
    shopping:'ลองทำลิสต์ก่อนช้อปปิ้งทุกครั้ง เพื่อลดการซื้อของที่ไม่จำเป็น',
    other:'ลองจดรายจ่ายจิปาถะทุกวัน จะช่วยให้ควบคุมงบประมาณได้ดีขึ้น',
  };
  document.getElementById('tipText').textContent = topCat ? tips[topCat] : 'เริ่มบันทึกรายจ่ายเพื่อรับคำแนะนำที่เหมาะกับคุณ';
}
function setPeriod(p){ state.reportPeriod=p; renderReports(); }

/* ===================== BUDGET INLINE EDIT ===================== */
function editBudget(){
  const el = document.getElementById('budgetValueDisplay');
  const input = document.createElement('input');
  input.type='number'; input.value=state.budget; input.min=0;
  input.onblur = ()=>commitBudget(input.value);
  input.onkeydown = (e)=>{ if(e.key==='Enter') input.blur(); };
  el.replaceWith(input);
  input.focus(); input.select();
}
function commitBudget(v){
  const n = parseFloat(v);
  if(!isNaN(n) && n>0) state.budget = n;
  renderDashboard();
  if(document.getElementById('tab-reports').classList.contains('active')) renderReports();
  showToast('อัปเดตงบประมาณเรียบร้อย');
}

/* ===================== ADD TRANSACTION MODAL ===================== */
function openAddModal(type){
  modalType = type; modalCat = 'food';
  document.getElementById('txTitle').value='';
  document.getElementById('txAmount').value='';
  document.getElementById('txError').style.display='none';
  document.getElementById('txDate').value = TODAY.toISOString().slice(0,10);
  renderCatGrid();
  setModalType(type);
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal(){ document.getElementById('addModal').classList.remove('open'); }
function setModalType(type){
  modalType=type;
  document.getElementById('typeExpenseOpt').className = 'type-opt'+(type==='expense'?' active-expense':'');
  document.getElementById('typeIncomeOpt').className = 'type-opt'+(type==='income'?' active-income':'');
  document.getElementById('categoryField').style.display = type==='expense' ? 'block':'none';
  document.getElementById('txTitle').placeholder = type==='expense' ? 'เช่น ข้าวมันไก่, ค่ารถเมล์' : 'เช่น เงินเดือน, เงินจากที่บ้าน';
}
function renderCatGrid(){
  document.getElementById('catGrid').innerHTML = Object.keys(CATS).map(k=>
    `<div class="cat-chip ${modalCat===k?'selected':''}" onclick="selectCat('${k}')"><span class="em">${CATS[k].em}</span>${CATS[k].label}</div>`).join('');
}
function selectCat(k){ modalCat=k; renderCatGrid(); }
function submitTransaction(){
  const amt = parseFloat(document.getElementById('txAmount').value);
  if(isNaN(amt) || amt<=0){ document.getElementById('txError').style.display='block'; return; }
  document.getElementById('txError').style.display='none';
  const title = document.getElementById('txTitle').value.trim();
  const dateVal = document.getElementById('txDate').value;
  const date = dateVal ? new Date(dateVal+'T00:00:00') : new Date(TODAY);
  state.txs.push({
    id: nextId++,
    type: modalType,
    cat: modalType==='income' ? 'income' : modalCat,
    title: title || (modalType==='income' ? 'รายรับ' : CATS[modalCat].label),
    amount: amt,
    date
  });
  closeAddModal();
  renderDashboard();
  if(document.getElementById('tab-list').classList.contains('active')) renderList();
  if(document.getElementById('tab-reports').classList.contains('active')) renderReports();
  showToast(modalType==='income' ? 'บันทึกรายรับเรียบร้อย' : 'บันทึกรายจ่ายเรียบร้อย');
}

/* ===================== MISC ===================== */
function toggleNotif(){
  state.notif = !state.notif;
  document.getElementById('notifToggle').classList.toggle('on', state.notif);
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* init */
checkAuthAndEnter();
</script>
</body>
</html>
